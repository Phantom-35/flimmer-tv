name: Push einrichten

# Einmalig (oder nach Schlüsselwechsel) manuell starten: setzt den privaten
# VAPID-Schlüssel als Secret des Cloudflare-Workers. Der öffentliche Schlüssel
# steht in wrangler.jsonc (vars.VAPID_PUBLIC_KEY) und muss dazu passen.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: VAPID-Schlüssel als Worker-Secret setzen
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$RAW_TOKEN" | LC_ALL=C tr -cd 'A-Za-z0-9_-')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$RAW_ACCOUNT" | LC_ALL=C tr -cd 'a-f0-9')"
          printf '%s' "$VAPID_PRIVATE_KEY" | npx --yes wrangler@4 secret put VAPID_PRIVATE_KEY --name flimmer-tv
